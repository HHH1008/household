name: 发布手机安装页面

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成静态 PWA
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /household
          NEXT_PUBLIC_SITE_URL: https://hhh1008.github.io
        run: npm run build

      - name: 准备 Pages 文件
        env:
          NEXT_PUBLIC_BASE_PATH: /household
        run: node scripts/prepare-pages.mjs

      - name: 上传 Pages 文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
